    <div id="clickForMusic" class="musicClick">CLICK ANYWHERE FOR MUSIC :)</div>
    <div class="bGround"></div>
    <div id="gateClose" class="gateAnimation" style="display: none;">
        <div class="gate gateTop"></div>

     <nav class="navig">

    <section id="contact" class="contactSection">
        <div class="contactData">
            <div>

            <div>

    <audio id="charMusic" src="../pictures/contact.mp3" loop></audio>

    <script>
        window.addEventListener('scroll', () => {
            const scroll = window.pageYOffset;
            const bg = document.querySelector('.bGround');
            if (bg) bg.style.transform = `translateY(-${scroll * 0.3}px)`;
        });
    </script>
    <script src="../script.js"></script>
</body>
